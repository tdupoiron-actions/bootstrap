name: Issue and Comment Management

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  manage-issue-and-comment:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create Issue
        id: create-issue
        uses: tdupoiron-actions/create-issue-action@v1.1.1
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.repository }}
          title: '🤖 GitHub Actions Automation Demo'
          body: |
            ## GitHub Actions Automation Demo
            
            🚀 **Purpose:** Demonstrating GitHub Actions workflow automation capabilities
            
            ### What This Demo Shows
            
            This issue is part of a live demonstration showcasing the power and flexibility of GitHub Actions. Watch as this workflow automatically:
            
            **Automated Actions:**
            - ✅ Creates this issue programmatically
            - 💬 Adds a comment to the issue
            - 🔒 Closes the issue automatically
            - 📊 Generates a workflow summary
            
            ### Key GitHub Actions Features Demonstrated
            
            - **Workflow Dispatch:** Manual triggering for on-demand automation
            - **Custom Actions:** Using community and custom-built actions
            - **GitHub Script:** Leveraging Octokit for GitHub API interactions
            - **Permissions Management:** Fine-grained control over workflow capabilities
            - **Step Outputs:** Passing data between workflow steps
            
            ### Technologies Used
            - 🔧 GitHub Actions workflow syntax
            - 📦 Custom action: `tdupoiron-actions/create-issue-action@v1.1.1`
            - 💬 Community action: `peter-evans/create-or-update-comment@v4`
            - 🐙 GitHub Script with Octokit REST API
            
            ---
            _This issue was automatically created as part of a GitHub Actions automation demonstration._
      
      - name: Add Comment to Commit
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ steps.create-issue.outputs.issue-number }}
          body: |
            🤖 **GitHub Actions Automation Demo - Step 2**
            
            This comment demonstrates automated interaction with GitHub issues using Actions workflows.
            
            ### What Just Happened? 
            
            1. ✅ A workflow was triggered (manually via `workflow_dispatch`)
            2.  📝 An issue was automatically created
            3. 💬 This comment was added programmatically
            4. 🔄 Next: The issue will be automatically closed
            
            ### Why This Matters
            
            GitHub Actions enables teams to:
            - Automate repetitive tasks
            - Streamline issue management
            - Build custom CI/CD pipelines
            - Integrate with GitHub's powerful API
            - Create sophisticated automation workflows
            
            **Workflow Run:** ${{ github.run_id }}
            **Commit SHA:** `${{ github.sha }}`
            
            ---
            _Powered by GitHub Actions automation_ 🚀
      
      - name: Close Issue with Octokit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const issueNumber = ${{ steps.create-issue.outputs.issue-number }};
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo. repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            
            console.log(`✅ Successfully closed issue #${issueNumber}`);
      
      - name: Summary
        run: |
          echo "## 🤖 GitHub Actions Automation Demo - Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Issue Created:** #${{ steps.create-issue.outputs.issue-number }}" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Issue URL:** ${{ steps.create-issue.outputs.issue-url }}" >> $GITHUB_STEP_SUMMARY
          echo "💬 **Comment added to issue:** #${{ steps.create-issue. outputs.issue-number }}" >> $GITHUB_STEP_SUMMARY
          echo "🔒 **Issue Closed:** #${{ steps.create-issue.outputs.issue-number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Demo Complete:** GitHub Actions automation demonstrated successfully!" >> $GITHUB_STEP_SUMMARY
